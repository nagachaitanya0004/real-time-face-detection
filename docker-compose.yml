version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: face_detection_db
    user: "70:70"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword}
      POSTGRES_DB: ${POSTGRES_DB:-facedetection}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: face_detection_redis
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: face_detection_backend
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-securepassword}@db:5432/${POSTGRES_DB:-facedetection}
      - REDIS_URL=redis://redis:6379/0
      # CORS configuration for development and production
      - CORS_ORIGINS=http://localhost,http://localhost:80
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          # MediaPipe requires significant memory for model inference
          memory: 768M
    healthcheck:
      # Targeting the custom /health endpoint instead of /docs
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: face_detection_frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
      - frontend_exposed
    ports:
      - "80:80"
    restart: unless-stopped

networks:
  internal:
    driver: bridge
    internal: true
  frontend_exposed:
    driver: bridge

volumes:
  postgres_data:
