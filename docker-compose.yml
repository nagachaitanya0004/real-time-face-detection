# Purpose: Orchestration for the production-grade face detection application suite.

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: face_detection_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword}
      POSTGRES_DB: ${POSTGRES_DB:-facedetection}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: face_detection_redis
    # Persistence disabled for ephemeral queue as per requirements
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: face_detection_backend
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-securepassword}@db:5432/${POSTGRES_DB:-facedetection}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: face_detection_frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
      - frontend_exposed
    ports:
      - "80:80"
    restart: unless-stopped

networks:
  # Internal network for service-to-service communication
  internal:
    driver: bridge
    internal: true
  # Separate network for external host access
  frontend_exposed:
    driver: bridge

volumes:
  postgres_data:
