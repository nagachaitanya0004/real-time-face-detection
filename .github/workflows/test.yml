name: Backend Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-asyncio httpx PIL-mock # Ensure test deps are present
        
    - name: Security Check - No OpenCV
      run: |
        grep -r "import cv2" backend/ && exit 1 || echo "No OpenCV found - PASS"
        
    - name: Run Pytest
      run: |
        cd backend
        pytest --tb=short -q
