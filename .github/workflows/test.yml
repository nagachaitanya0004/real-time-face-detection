# Purpose: Automated testing workflow for GitHub Actions.

name: Face Detection Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      # Optional: could add real postgres/redis for integration tests here
      # but we are using mocks for the core test suite.
      
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio httpx Pillow numpy mediapipe asyncpg redis fastapi uvicorn python-multipart
        
    - name: Run Tests
      run: |
        cd backend
        pytest
